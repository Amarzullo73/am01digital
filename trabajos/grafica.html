<!-- Galería modal: pegar justo antes de </body> (después de la inclusión de bootstrap.js si existe) -->
 
<div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body p-0 text-center position-relative">
        <button type="button" class="btn-close btn-close-white position-absolute end-0 m-3"
                data-bs-dismiss="modal" aria-label="Cerrar"></button>

        <button type="button" class="btn btn-dark btn-sm position-absolute start-0 top-50 translate-middle-y ms-2 prev-btn" aria-label="Anterior">&larr;</button>
        <button type="button" class="btn btn-dark btn-sm position-absolute end-0 top-50 translate-middle-y me-2 next-btn" aria-label="Siguiente">&rarr;</button>

        <img id="photoModalImage" src="" class="img-fluid mx-auto d-block" alt="">
        <div id="photoModalCaption" class="position-absolute bottom-0 start-0 end-0 bg-black bg-opacity-50 text-white py-2 small text-center"></div>
      </div>
    </div>
  </div>
</div>


<style>
  /* estilos locales para modal de imágenes */
  #photoModalImage { max-height: 90vh; width: auto; object-fit: contain; }
  .prev-btn, .next-btn { z-index: 1060; opacity: .9; }
</style>

<style>
  /* estilos locales para modal de imágenes */
  #photoModalImage { max-height: 90vh; width: auto; object-fit: contain; }
  .prev-btn, .next-btn { z-index: 1060; opacity: .9; }

  /* fondo de modal más oscuro (sobrescribe valor por defecto) */
  .modal-backdrop.show {
    background-color: rgba(0,0,0,0.95) !important;
  }

  /* ocultar el caption del modal por defecto (se mostrará sólo si se necesita) */
  #photoModalCaption { display: none; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const imgs = Array.from(document.querySelectorAll('#trabajos-graficas img'));
    if (!imgs.length) return;

    const modalEl = document.getElementById('photoModal');
    const modalImg = document.getElementById('photoModalImage');
    const modalCaption = document.getElementById('photoModalCaption');
    const prevBtn = modalEl.querySelector('.prev-btn');
    const nextBtn = modalEl.querySelector('.next-btn');
    let bsModal = null;
    let current = 0;
    let hiddenOverlay = null;
    let hiddenText = null; // para ocultar el <h2> debajo de la foto si existe

    const gallery = imgs.map(img => ({
      src: img.getAttribute('src'),
      caption: img.getAttribute('alt') || (img.closest('.col') && img.closest('.col').querySelector('h2') ? img.closest('.col').querySelector('h2').textContent.trim() : '')
    }));

    function show(i) {
      const entry = gallery[i];
      if (!entry) return;
      modalImg.src = entry.src;
      // no mostrar texto en el modal (según petición)
      modalCaption.textContent = '';
      modalCaption.style.display = 'none';
      prevBtn.style.display = i > 0 ? 'block' : 'none';
      nextBtn.style.display = i < gallery.length - 1 ? 'block' : 'none';
      current = i;
    }

    imgs.forEach((img, i) => {
      img.style.cursor = 'pointer';
      img.addEventListener('click', function (e) {
        e.preventDefault();

        // ocultar overlay "+" si existe (clase d-none)
        const parentItem = img.closest('.trabajo-item') || img.parentElement;
        const overlay = parentItem ? parentItem.querySelector('.trabajo-overlay') : null;
        if (overlay) { hiddenOverlay = overlay; overlay.classList.add('d-none'); }

        // ocultar texto/h2 debajo de la imagen si existe
        const nextH2 = parentItem ? parentItem.nextElementSibling : null;
        if (nextH2 && nextH2.tagName === 'H2') { hiddenText = nextH2; hiddenText.classList.add('d-none'); }

        show(i);
        if (!bsModal) bsModal = new bootstrap.Modal(modalEl);
        bsModal.show();
      });
    });

    prevBtn.addEventListener('click', function (e) { e.stopPropagation(); if (current > 0) show(current - 1); });
    nextBtn.addEventListener('click', function (e) { e.stopPropagation(); if (current < gallery.length - 1) show(current + 1); });

    document.addEventListener('keydown', function (e) {
      if (!bsModal) return;
      if (!modalEl.classList.contains('show')) return;
      if (e.key === 'ArrowLeft' && current > 0) show(current - 1);
      if (e.key === 'ArrowRight' && current < gallery.length - 1) show(current + 1);
      if (e.key === 'Escape') bsModal.hide();
    });

    modalEl.addEventListener('hidden.bs.modal', function () {
      modalImg.src = '';
      // restaurar overlay y texto ocultos
      if (hiddenOverlay) { hiddenOverlay.classList.remove('d-none'); hiddenOverlay = null; }
      if (hiddenText) { hiddenText.classList.remove('d-none'); hiddenText = null; }
    });
  });
</script>
